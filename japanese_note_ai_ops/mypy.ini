[mypy]
# Don't type-check vendored libraries or the jp_text_processing submodule
# (which has its own module root and would need to be checked separately)
exclude = (?x)(
    ^lib/
    | ^shared/
    | ^word_array/research/migrate\.py$
  )

# Resolve the "source file found twice" issue caused by __init__.py at the
# workspace root making this directory both a package and a checked namespace
explicit_package_bases = True

# The same two script directories the repo-root mypy.ini names, relative to this root: their
# modules import each other by bare name because each directory is on sys.path when they run.
# See that file for the full explanation and for why research/migrate.py is excluded above.
mypy_path =
    test,
    word_array/research

# The research scripts name the real classes of what `_bootstrap.load()` hands them by importing
# them for type checking only, as `japanese_note_ai_ops.word_array.<module>` - the name a run
# rooted at the repo above resolves. This root is inside that package, so the same name cannot
# resolve here (adding `..` to mypy_path finds every file twice); a run started here sees those
# values as Any, which is what it saw before the imports were added.
[mypy-japanese_note_ai_ops.*]
ignore_missing_imports = True

# Silence import errors for the vendored lib packages that are imported by
# the actual source files (e.g. requests, rapidfuzz, tqdm, colorama)
[mypy-requests.*]
ignore_missing_imports = True

[mypy-rapidfuzz.*]
ignore_missing_imports = True

[mypy-tqdm.*]
ignore_missing_imports = True

[mypy-colorama.*]
ignore_missing_imports = True

[mypy-mdict_query.*]
ignore_missing_imports = True

[mypy-mdict_utils.*]
ignore_missing_imports = True

[mypy-json_repair.*]
ignore_missing_imports = True

[mypy-xxhash.*]
ignore_missing_imports = True

[mypy-aqt.*]
ignore_missing_imports = True

[mypy-anki.*]
ignore_missing_imports = True
