[pytest]
testpaths = anki_shared/test anki_shared/test_anki related_card_disperse/test copy_anywhere/test copy_anywhere/test_anki japanese_note_ai_ops/word_array/research/test
python_files = test_*.py
# aqt subclasses real Qt widgets and branches on qtmajor, so Qt must genuinely import;
# without naming the binding, PyQt6.QtCore fails to load its DLLs under pytest-qt.
qt_api = pyqt6
# pytest-anki marks *every* collected test `forked`, stub-mode ones included. That is inert
# until pytest-forked is installed, at which point each test would try to fork, which
# Windows cannot do at all. The suites are built to share one process instead.
anki_force_fork = false
