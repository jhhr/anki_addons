[mypy]
python_version = 3.10

# Resolve the "source file found twice" issue caused by __init__.py at the
# workspace root making each addon both a package and a checked namespace
explicit_package_bases = True

# mypy matches this against paths with forward slashes, on Windows too. None of these trees is
# the repo's own source and all of them are gitignored: `build/` and `dist/` are build.py's
# vendor scratch and its packaged output, `*/lib/` is the vendored dependency tree,
# `*/user_files/` is Anki's per-install state (which holds a second lib/), and `*/shared/` is
# the junction `build.py link` points at anki_shared/ -- already checked at its real path.
# japanese_note_ai_ops/mypy.ini excludes the same trees for a run started from there.
exclude = (?x)(
    ^(build|dist)/
    | /(lib|user_files|shared)/
    | ^anki_shared/jp_text_processing/
  )

# The `*/shared/` junctions are reached through imports as well as by crawling, and `exclude`
# only stops the crawl, so the duplicate copy is silenced by module name too. `anki_shared.*`
# is a different module name and stays checked.
[mypy-*.shared.*]
ignore_errors = True

# `anki_shared/jp_text_processing/` is its own repo with its own `pyproject.toml` and its own
# mypy count, measured by `python -m mypy .` from that directory. Excluded from the crawl above
# and silenced here so that a run from this root counts only this repo's errors; its types
# still flow into the modules that import it.
[mypy-anki_shared.jp_text_processing.*]
ignore_errors = True
