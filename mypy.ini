[mypy]
python_version = 3.10

# Resolve the "source file found twice" issue caused by __init__.py at the
# workspace root making each addon both a package and a checked namespace
explicit_package_bases = True

# Three directories hold modules that import each other by bare name (`import vocab_dupes`,
# `import addon_modules`, `import definitions`) because they are on sys.path at runtime: the
# research scripts are run as `python word_array/research/<script>.py`, so the script's own
# directory is sys.path[0], and each test directory puts itself there (its conftest, or
# test/addon_modules.py). None of them has an __init__.py. Naming them here - which
# explicit_package_bases turns into "this is where a top-level module may start" - gives those
# files the module names the runtime gives them, so mypy resolves the sibling imports instead
# of reporting 180 import-not-found and treating every sibling as Any.
# This is not the mypy_path task 22 removed: that one named the system Python's site-packages
# and shadowed real libraries. These are the repo's own trees and shadow nothing.
mypy_path =
    copy_anywhere/test,
    japanese_note_ai_ops/test,
    japanese_note_ai_ops/word_array/research

# mypy matches this against paths with forward slashes, on Windows too. None of these trees is
# the repo's own source and all of them are gitignored: `build/` and `dist/` are build.py's
# vendor scratch and its packaged output, `*/lib/` is the vendored dependency tree,
# `*/user_files/` is Anki's per-install state (which holds a second lib/), and `*/shared/` is
# the junction `build.py link` points at anki_shared/ -- already checked at its real path.
# japanese_note_ai_ops/mypy.ini excludes the same trees for a run started from there.
exclude = (?x)(
    ^(build|dist)/
    | /(lib|user_files|shared)/
    | ^anki_shared/jp_text_processing/
    | ^copy_anywhere/test/conftest\.py$
    | ^japanese_note_ai_ops/test/conftest\.py$
    | ^japanese_note_ai_ops/word_array/research/migrate\.py$
  )

# The three files above are excluded for what mypy_path does to their module names, not for
# what they contain; none of them has an error today.
# The two conftest.py would both become the top-level module `conftest` and collide with the
# repo root's. Each is a handful of lines putting its own directory on sys.path, so nothing is
# lost by not checking them.
# `research/migrate.py` is the one module in that directory that is not a script: it is loaded
# as a package module by `_bootstrap.load("research.migrate")` and imports through `...` and
# `..`, which a top-level module cannot do. Nothing imports it by name, so mypy only ever sees
# it by crawling.

# The `*/shared/` junctions are reached through imports as well as by crawling, and `exclude`
# only stops the crawl, so the duplicate copy is silenced by module name too. `anki_shared.*`
# is a different module name and stays checked.
[mypy-*.shared.*]
ignore_errors = True

# `anki_shared/jp_text_processing/` is its own repo with its own `pyproject.toml` and its own
# mypy count, measured by `python -m mypy .` from that directory. Excluded from the crawl above
# and silenced here so that a run from this root counts only this repo's errors; its types
# still flow into the modules that import it.
[mypy-anki_shared.jp_text_processing.*]
ignore_errors = True

# japanese_note_ai_ops vendors mdict_query into its lib/, which the crawl skips and no search
# path reaches, so the one test that imports it to compare against the shipped implementation
# has nothing to resolve. japanese_note_ai_ops/mypy.ini already says this for a run started
# from there.
[mypy-mdict_query.*]
ignore_missing_imports = True
